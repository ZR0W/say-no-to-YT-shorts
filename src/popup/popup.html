<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Say No to YouTube Shorts</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="panel">
      <h1 class="title">YouTube visibility</h1>
      <p class="hint">Turn off an option to show that UI again.</p>

      <p class="section-label">Shorts</p>
      <div class="row">
        <input type="checkbox" id="hideSidebarShorts" />
        <label for="hideSidebarShorts">Hide sidebar Shorts link</label>
      </div>
      <div class="row">
        <input type="checkbox" id="hideReelShelf" />
        <label for="hideReelShelf">Hide Shorts reel / shelf rows</label>
      </div>
      <div class="row">
        <input type="checkbox" id="hideRichShortsSections" />
        <label for="hideRichShortsSections">Hide sections titled "Shorts"</label>
      </div>
      <div class="row">
        <input type="checkbox" id="hideNavigationShorts" />
        <label for="hideNavigationShorts">Hide Shorts tabs &amp; filter chips</label>
      </div>

      <p class="section-label">Playables</p>
      <p class="section-hint">Only visible on accounts where YouTube has enabled this feature.</p>
      <div class="row">
        <input type="checkbox" id="hidePlayables" />
        <label for="hidePlayables">Hide Playables shelf &amp; games</label>
      </div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
